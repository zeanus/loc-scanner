<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>빈 로케이션 바코드 스캐너</title>
  <script>
    // Google Apps Script 웹 앱 URL
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyQUV5Pm4W6Ocp06swFBZbXxHMqYfncR-emzegPJBQMjuos5LHecKB2fs1ELNvNa9M/exec';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --bg: #f3f4f6;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0 0 40px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }

    .tabs {
      display: flex; position: sticky; top: 0; z-index: 20;
      background: var(--card); border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 14px 8px; border: none; background: none;
      font-size: 15px; font-weight: 700; color: #6b7280; cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .container { max-width: 560px; margin: 0 auto; padding: 12px; }
    .section { display: none; }
    .section.active { display: block; }

    .error-banner {
      background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5;
      padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45;
      margin-bottom: 10px; display: none; word-break: break-word;
    }

    .card {
      background: var(--card); border-radius: 12px; padding: 12px;
      margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: #4b5563;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }

    .scanner-wrap {
      position: relative; width: 100%; min-height: 260px;
      background: #0f172a; border-radius: 12px; overflow: hidden;
      margin-bottom: 10px;
    }
    #reader { width: 100%; }
    .laser-line {
      position: absolute; left: 6%; right: 6%; top: 50%; height: 2px;
      background: rgba(239, 68, 68, 0.95);
      box-shadow: 0 0 10px 2px rgba(239, 68, 68, 0.8);
      transform: translateY(-50%); pointer-events: none; z-index: 15;
      display: none;
    }
    .scan-hud {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); color: #f8fafc;
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
      white-space: nowrap; z-index: 16; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .cam-controls { display: flex; gap: 6px; margin-bottom: 10px; }
    .btn {
      flex: 1; padding: 12px 10px; border: none; border-radius: 9px;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
    }
    .btn-primary { background: var(--primary); }
    .btn-dark { background: #334155; }
    .btn-amber { background: var(--warn); }
    .btn-green { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-outline {
      background: #fff; color: var(--text); border: 1px solid var(--border);
    }
    .btn:disabled { opacity: 0.5; }

    .opt-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: #374151; gap: 8px; flex-wrap: wrap;
    }
    .opt-row label { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }

    .row-flex { display: flex; gap: 8px; align-items: center; }
    input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px;
    }

    .recent-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px;
    }
    .btn-mini {
      padding: 5px 10px; border-radius: 6px; border: none;
      font-size: 12px; font-weight: 700; cursor: pointer;
      background: #fee2e2; color: var(--danger);
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.68);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 50; padding: 12px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%; max-width: 520px; background: #fff;
      border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: slideUp 0.15s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .modal-badge {
      display: inline-block; background: #dbeafe; color: #1d4ed8;
      font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 20px;
    }
    .edit-hint { font-size: 12px; color: #6b7280; font-weight: 600; }

    .modal-code-input {
      width: 100% !important;
      background: #0f172a; color: #38bdf8;
      border: 2px solid #38bdf8 !important; border-radius: 12px !important;
      padding: 13px 10px !important; text-align: center;
      font-size: 25px !important; font-weight: 900; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .modal-code-input:focus { outline: none; border-color: #60a5fa !important; }

    .nudge-row {
      display: flex; gap: 6px; align-items: center; margin-bottom: 10px;
    }
    .nudge-label { font-size: 12px; font-weight: 700; color: #4b5563; white-space: nowrap; }
    .nudge-btn {
      flex: 1; padding: 8px 6px; border: 1px solid var(--border); border-radius: 8px;
      background: #f8fafc; font-size: 13px; font-weight: 800; color: #1e293b; cursor: pointer;
    }
    .nudge-btn:active { background: #e2e8f0; }

    .tier-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 12px;
    }
    .tier-btn {
      padding: 10px 0; border: 1px solid var(--border); border-radius: 8px;
      background: #f9fafb; font-size: 14px; font-weight: 800; cursor: pointer;
    }
    .tier-btn.selected {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }

    .chip-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chip {
      padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: #f9fafb; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .chip.active { background: #dbeafe; border-color: var(--primary); color: #1d4ed8; }

    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .toolbar .btn { padding: 10px 6px; font-size: 13px; min-width: 90px; }
    .filter-scroll {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px;
    }
    .filter-pill {
      white-space: nowrap; padding: 6px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .filter-pill.active { background: #1e293b; color: #fff; border-color: #1e293b; }

    .loc-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px; background: #fff; border-radius: 10px; margin-bottom: 8px;
      border-left: 5px solid var(--success); box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .loc-item.reserved { border-left-color: var(--warn); background: #fffbeb; }
    .loc-chk { width: 20px; height: 20px; accent-color: var(--primary); }
    .loc-info { flex: 1; }
    .loc-code { font-size: 16px; font-weight: 800; }
    .loc-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 4px;
      font-size: 11px; font-weight: 700; margin-left: 6px;
    }
    .badge-empty { background: #dcfce7; color: #166534; }
    .badge-res { background: #fef3c7; color: #92400e; }

    #toast {
      position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
      background: rgba(17,24,39,0.93); color: #fff; padding: 10px 18px;
      border-radius: 24px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabScanBtn" onclick="switchTab('scan')">📷 바코드 스캔</button>
    <button type="button" class="tab-btn" id="tabListBtn" onclick="switchTab('list')">📋 입고 현황 (<span id="totalBadge">0</span>)</button>
  </div>

  <div id="toast"></div>

  <!-- 탭 1: 1회 즉시 스캔 -->
  <div id="sec-scan" class="container section active">
    <div id="errorBox" class="error-banner"></div>

    <div class="scanner-wrap">
      <div id="reader"></div>
      <div id="laserLine" class="laser-line"></div>
      <div id="scanHud" class="scan-hud">카메라 켜기를 눌러 스캔을 시작하세요</div>
    </div>

    <div class="cam-controls">
      <button type="button" id="btnCamToggle" class="btn btn-primary" onclick="toggleCamera()">📷 카메라 켜기</button>
      <button type="button" id="btnTorch" class="btn btn-dark" style="display:none; flex:0.55;" onclick="toggleTorch()">🔦 플래시</button>
      <button type="button" id="btnZoom" class="btn btn-dark" style="display:none; flex:0.5;" onclick="toggleZoom()">🔍 1x</button>
    </div>

    <div class="card">
      <div class="opt-row" style="margin-bottom:8px;">
        <label>
          <input type="checkbox" id="chkStrictFormat" checked>
          로케이션 형식만 인식 (박스 바코드 무시)
        </label>
      </div>
      <div class="row-flex">
        <input type="text" id="workerName" placeholder="작업자 이름 (자동저장)" onchange="saveWorker()">
      </div>
    </div>

    <div class="card">
      <div class="card-title">바코드 훼손 시 직접 입력</div>
      <div class="row-flex">
        <input type="text" id="manualCode" placeholder="예: 3F-G01-12-04" style="text-transform:uppercase;">
        <button type="button" class="btn btn-dark" style="flex:0.35; padding:10px;" onclick="openManualConfirm()">확인</button>
      </div>
    </div>

    <div class="card" id="recentCard" style="display:none;">
      <div class="card-title">방금 등록한 내역 (실수 시 바로 취소)</div>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- 탭 2: 입고 현황 및 엑셀 복사 -->
  <div id="sec-list" class="container section">
    <div class="toolbar">
      <button type="button" class="btn btn-primary" onclick="copySelected()">📋 선택 복사</button>
      <button type="button" class="btn btn-amber" onclick="batchUpdate('선점중')">🏷️ 선점</button>
      <button type="button" class="btn btn-green" onclick="batchUpdate('입고완료')">✅ 입고완료</button>
      <button type="button" class="btn btn-dark" style="flex:0.35; min-width:52px;" onclick="loadList()">🔄</button>
    </div>

    <div class="filter-scroll" id="gFilterBar"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:0 4px;">
      <label style="font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="chkAll" class="loc-chk" onchange="toggleAllChk(this.checked)"> 전체 선택
      </label>
      <span id="listCountText" style="font-size:13px; color:#4b5563;">총 0건</span>
    </div>

    <div id="locListContainer">불러오는 중...</div>
  </div>

  <!-- 스캔 즉시 확인 및 수정 모달 -->
  <div id="confirmModal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-badge">스캔 인식 완료</span>
        <span class="edit-hint">✏️ 코드 터치 시 직접 수정</span>
      </div>

      <input type="text" id="modalCodeInput" class="modal-code-input"
             oninput="syncQuickButtonsFromInput()"
             autocomplete="off" autocapitalize="characters" spellcheck="false">

      <div id="quickFixWrap">
        <div class="nudge-row">
          <span class="nudge-label">번호 보정</span>
          <button type="button" class="nudge-btn" onclick="nudgeBay(-1)">◀ -1</button>
          <button type="button" class="nudge-btn" onclick="nudgeBay(1)">+1 ▶</button>
        </div>
        <div class="card-title" style="margin-bottom:6px;">
          <span>단 보정 (01~07단)</span>
          <span style="color:#6b7280; font-weight:500;">터치 시 즉시 반영</span>
        </div>
        <div class="tier-grid" id="modalTierGrid"></div>
      </div>

      <div class="chip-wrap" id="memoChips">
        <span class="chip" onclick="toggleMemo(this, '파렛트 1단')">파렛트 1단</span>
        <span class="chip" onclick="toggleMemo(this, '파렛트 2단')">파렛트 2단</span>
        <span class="chip" onclick="toggleMemo(this, '소형/박스')">소형/박스</span>
        <span class="chip" onclick="toggleMemo(this, '높이낮음')">높이낮음</span>
      </div>
      <input type="text" id="modalMemo" placeholder="추가 메모 (선택)" style="margin-bottom:14px;">

      <div class="row-flex">
        <button type="button" class="btn btn-outline" style="flex:0.45;" onclick="closeModal()">취소 / 재스캔</button>
        <button type="button" id="btnConfirmSubmit" class="btn btn-primary" onclick="submitConfirmedCode()">빈자리 등록</button>
      </div>
    </div>
  </div>

  <script>
    const LOCATION_REGEX = /^[0-9A-Z]+-[A-Z]+\d+-\d+-\d+$/i;
    const MAX_TIERS = 7;

    let html5QrCode = null;
    let isScanning = false;
    let isModalOpen = false;
    let isTorchOn = false;
    let isZoomed = false;
    let audioCtx = null;

    let recentCodes = [];
    let allData = [];
    let filterG = 'ALL';

    function showError(msg) {
      const box = document.getElementById('errorBox');
      if (!box) return;
      box.innerHTML = '⚠️ ' + msg;
      box.style.display = 'block';
    }

    function clearError() {
      const box = document.getElementById('errorBox');
      if (box) box.style.display = 'none';
    }

    window.onerror = function(message, source, lineno) {
      showError('화면 오류(' + lineno + '줄): ' + message);
    };

    window.addEventListener('DOMContentLoaded', function() {
      const savedWorker = localStorage.getItem('wms_worker_name');
      if (savedWorker) document.getElementById('workerName').value = savedWorker;
      initTierButtons();
      loadList();
    });

    function initTierButtons() {
      const grid = document.getElementById('modalTierGrid');
      let html = '';
      for (let i = 1; i <= MAX_TIERS; i++) {
        const t = String(i).padStart(2, '0');
        html += `<button type="button" class="tier-btn" data-tier="${t}" onclick="changeTier('${t}')">${t}</button>`;
      }
      grid.innerHTML = html;
    }

    function saveWorker() {
      localStorage.setItem('wms_worker_name', document.getElementById('workerName').value.trim());
    }

    function initAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playBeep(freq, duration) {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq || 1350;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (duration || 0.09));
      } catch (e) {}
    }

    // 외부 바코드 라이브러리 자동 확보 (jsDelivr 실패 시 unpkg 백업 로드)
    function ensureScannerLibrary() {
      return new Promise((resolve, reject) => {
        if (typeof Html5Qrcode !== 'undefined') {
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.onload = () => {
          if (typeof Html5Qrcode !== 'undefined') resolve();
          else reject(new Error('스캐너 라이브러리 초기화 실패'));
        };
        script.onerror = () => reject(new Error('네트워크 또는 회사 와이파이가 스캐너 라이브러리 다운로드를 차단했습니다. 와이파이를 끄고 모바일 데이터(5G/LTE)로 다시 시도해 주세요.'));
        document.head.appendChild(script);
      });
    }

    async function toggleCamera() {
      clearError();
      initAudio();
      if (isScanning) {
        await stopCamera();
      } else {
        await startCamera();
      }
    }

    async function startCamera() {
      const btn = document.getElementById('btnCamToggle');
      btn.disabled = true;
      btn.textContent = '카메라 여는 중...';
      updateHud('카메라 준비 중...');

      try {
        if (!window.isSecureContext) {
          throw new Error('보안 주소(https://)에서만 카메라가 켜집니다. GitHub Pages 주소로 접속했는지 확인해 주세요.');
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('현재 브라우저에서는 카메라를 지원하지 않습니다. 카카오톡이 아닌 크롬(Chrome) 또는 사파리(Safari)로 열어주세요.');
        }

        await ensureScannerLibrary();

        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode('reader', {
            formatsToSupport: [
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.CODE_93,
              Html5QrcodeSupportedFormats.ITF,
              Html5QrcodeSupportedFormats.CODABAR
            ],
            experimentalFeatures: { useBarCodeDetectorIfSupported: true },
            verbose: false
          });
        }

        const config = {
          fps: 15,
          qrbox: function(vw, vh) {
            const w = Math.min(vw - 12, Math.max(50, Math.floor(vw * 0.88)));
            const h = Math.min(vh - 12, Math.max(54, Math.min(68, Math.floor(vh * 0.16))));
            return { width: w, height: h };
          }
        };

        try {
          await html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, () => {});
        } catch (firstErr) {
          // 일부 기기에서 facingMode 실패 시 후면 카메라 ID로 재시도
          const cameras = await Html5Qrcode.getCameras();
          if (!cameras || cameras.length === 0) throw firstErr;
          const backCam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
          await html5QrCode.start(backCam.id, config, onScanSuccess, () => {});
        }

        isScanning = true;
        document.getElementById('laserLine').style.display = 'block';
        updateHud('빨간 가로선에 바코드를 맞추세요');
        btn.textContent = '⏹ 카메라 끄기';
        btn.className = 'btn btn-danger';
        setupCameraCapabilities();
      } catch (err) {
        const msg = (err && err.message) ? err.message : String(err);
        showError('카메라 실행 실패: ' + msg);
        updateHud('카메라 시작 실패 (위 빨간 안내 확인)');
        btn.textContent = '📷 카메라 켜기';
        btn.className = 'btn btn-primary';
      } finally {
        btn.disabled = false;
      }
    }

    async function stopCamera() {
      if (!html5QrCode || !isScanning) return;
      try {
        await html5QrCode.stop();
      } catch (e) {}
      isScanning = false;
      isTorchOn = false;
      isZoomed = false;
      document.getElementById('laserLine').style.display = 'none';
      document.getElementById('btnTorch').style.display = 'none';
      document.getElementById('btnZoom').style.display = 'none';
      const btn = document.getElementById('btnCamToggle');
      btn.textContent = '📷 카메라 켜기';
      btn.className = 'btn btn-primary';
      updateHud('카메라 켜기를 눌러 스캔을 시작하세요');
    }

    function setupCameraCapabilities() {
      try {
        const caps = html5QrCode.getRunningTrackCameraCapabilities();
        if (caps.torchFeature && caps.torchFeature().isSupported()) {
          document.getElementById('btnTorch').style.display = 'block';
        }
        if (caps.zoomFeature && caps.zoomFeature().isSupported()) {
          document.getElementById('btnZoom').style.display = 'block';
        }
      } catch (e) {}
    }

    async function toggleTorch() {
      try {
        const caps = html5QrCode.getRunningTrackCameraCapabilities();
        isTorchOn = !isTorchOn;
        await caps.torchFeature().apply(isTorchOn);
        document.getElementById('btnTorch').className = isTorchOn ? 'btn btn-amber' : 'btn btn-dark';
      } catch (e) {
        showToast('이 기기에서는 플래시 제어가 지원되지 않습니다.');
      }
    }

    async function toggleZoom() {
      try {
        const caps = html5QrCode.getRunningTrackCameraCapabilities();
        const zoomFeat = caps.zoomFeature();
        isZoomed = !isZoomed;
        const target = isZoomed ? Math.min(2.0, zoomFeat.max()) : zoomFeat.min();
        await zoomFeat.apply(target);
        document.getElementById('btnZoom').textContent = isZoomed ? `🔍 ${target.toFixed(1)}x` : '🔍 1x';
      } catch (e) {
        showToast('이 기기에서는 줌 제어가 지원되지 않습니다.');
      }
    }

    function updateHud(text) {
      document.getElementById('scanHud').textContent = text;
    }

    function onScanSuccess(decodedText) {
      if (isModalOpen) return;

      const code = decodedText.trim().toUpperCase();
      const strict = document.getElementById('chkStrictFormat').checked;
      if (strict && !LOCATION_REGEX.test(code)) {
        return;
      }

      if (navigator.vibrate) navigator.vibrate(65);
      playBeep(1350, 0.09);
      updateHud('인식 완료! 확인 후 등록하세요');
      openConfirmModal(code);
    }

    function openManualConfirm() {
      const code = document.getElementById('manualCode').value.trim().toUpperCase();
      if (!code) { showToast('로케이션 코드를 입력해 주세요.'); return; }
      openConfirmModal(code);
    }

    function openConfirmModal(code) {
      isModalOpen = true;
      document.getElementById('modalCodeInput').value = code;
      document.getElementById('modalMemo').value = '';
      document.querySelectorAll('#memoChips .chip').forEach(c => c.classList.remove('active'));
      syncQuickButtonsFromInput();
      document.getElementById('confirmModal').classList.add('open');
    }

    function syncQuickButtonsFromInput() {
      const val = document.getElementById('modalCodeInput').value.trim().toUpperCase();
      const parts = val.split('-');
      const wrap = document.getElementById('quickFixWrap');

      if (parts.length === 4) {
        wrap.style.display = 'block';
        const curTier = parts[3].padStart(2, '0');
        document.querySelectorAll('#modalTierGrid .tier-btn').forEach(b => {
          b.classList.toggle('selected', b.dataset.tier === curTier);
        });
      } else {
        wrap.style.display = 'none';
      }
    }

    function changeTier(tier) {
      const input = document.getElementById('modalCodeInput');
      const parts = input.value.trim().toUpperCase().split('-');
      if (parts.length !== 4) return;
      parts[3] = tier;
      input.value = parts.join('-');
      syncQuickButtonsFromInput();
    }

    function nudgeBay(delta) {
      const input = document.getElementById('modalCodeInput');
      const parts = input.value.trim().toUpperCase().split('-');
      if (parts.length !== 4) return;
      const num = parseInt(parts[2], 10);
      if (isNaN(num)) return;
      const next = Math.max(1, Math.min(99, num + delta));
      parts[2] = String(next).padStart(2, '0');
      input.value = parts.join('-');
      syncQuickButtonsFromInput();
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('open');
      setTimeout(() => {
        isModalOpen = false;
        if (isScanning) updateHud('빨간 가로선에 바코드를 맞추세요');
      }, 600);
    }

    function toggleMemo(el, text) {
      const input = document.getElementById('modalMemo');
      const active = el.classList.toggle('active');
      if (active) {
        input.value = input.value ? `${input.value}, ${text}` : text;
      } else {
        input.value = input.value.split(',').map(s => s.trim()).filter(s => s !== text).join(', ');
      }
    }

    async function apiPost(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function submitConfirmedCode() {
      const finalCode = document.getElementById('modalCodeInput').value.trim().toUpperCase();
      if (!finalCode) { showToast('로케이션 코드를 입력해 주세요.'); return; }

      const btn = document.getElementById('btnConfirmSubmit');
      const worker = document.getElementById('workerName').value.trim() || '현장작업자';
      const memo = document.getElementById('modalMemo').value.trim();
      saveWorker();

      btn.disabled = true;
      btn.textContent = '저장 중...';

      try {
        const res = await apiPost({
          action: 'add',
          code: finalCode,
          worker: worker,
          memo: memo
        });

        showToast(res.message || '처리되었습니다.');
        if (res.success) {
          recentCodes.unshift(finalCode);
          if (recentCodes.length > 5) recentCodes.pop();
          renderRecent();
          document.getElementById('manualCode').value = '';
          loadList();
          closeModal();
        }
      } catch (err) {
        showError('구글 시트 전송 실패: ' + (err.message || err));
        showToast('전송 실패: 네트워크 상태를 확인하세요.');
      } finally {
        btn.disabled = false;
        btn.textContent = '빈자리 등록';
      }
    }

    function renderRecent() {
      const card = document.getElementById('recentCard');
      const list = document.getElementById('recentList');
      if (recentCodes.length === 0) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      list.innerHTML = recentCodes.map(code => {
        const safeCode = code.replace(/'/g, "\\'");
        return `
          <div class="recent-item">
            <strong>${code}</strong>
            <button type="button" class="btn-mini" onclick="undoRecent('${safeCode}')">등록 취소</button>
          </div>
        `;
      }).join('');
    }

    async function undoRecent(code) {
      try {
        await apiPost({ action: 'updateStatus', codes: [code], newStatus: '취소삭제' });
        recentCodes = recentCodes.filter(c => c !== code);
        renderRecent();
        loadList();
        showToast(`${code} 등록이 취소되었습니다.`);
      } catch (err) {
        showToast('취소 처리 실패');
      }
    }

    function switchTab(tab) {
      document.getElementById('tabScanBtn').classList.toggle('active', tab === 'scan');
      document.getElementById('tabListBtn').classList.toggle('active', tab === 'list');
      document.getElementById('sec-scan').classList.toggle('active', tab === 'scan');
      document.getElementById('sec-list').classList.toggle('active', tab === 'list');
      if (tab === 'list') {
        stopCamera();
        loadList();
      }
    }

    async function loadList() {
      if (!GAS_API_URL) return;
      try {
        const res = await fetch(`${GAS_API_URL}?action=list&t=${Date.now()}`);
        const json = await res.json();
        allData = (json.success && Array.isArray(json.data)) ? json.data : [];
        document.getElementById('totalBadge').textContent = allData.length;
        renderFilters();
        renderList();
      } catch (err) {
        document.getElementById('locListContainer').innerHTML =
          `<div class="card" style="text-align:center; color:#dc2626;">목록을 불러오지 못했습니다.</div>`;
      }
    }

    function renderFilters() {
      const bar = document.getElementById('gFilterBar');
      const gSet = [...new Set(allData.map(d => d.gLine).filter(Boolean))];
      let html = `<button type="button" class="filter-pill ${filterG === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">전체 (${allData.length})</button>`;
      gSet.forEach(g => {
        const cnt = allData.filter(d => d.gLine === g).length;
        html += `<button type="button" class="filter-pill ${filterG === g ? 'active' : ''}" onclick="setFilter('${g}')">${g} (${cnt})</button>`;
      });
      bar.innerHTML = html;
    }

    function setFilter(g) {
      filterG = g;
      document.getElementById('chkAll').checked = false;
      renderFilters();
      renderList();
    }

    function renderList() {
      const container = document.getElementById('locListContainer');
      const filtered = filterG === 'ALL' ? allData : allData.filter(d => d.gLine === filterG);
      document.getElementById('listCountText').textContent = `총 ${filtered.length}건`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; padding:30px; color:#6b7280;">현재 등록된 빈 로케이션이 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isRes = item.status === '선점중';
        return `
          <div class="loc-item ${isRes ? 'reserved' : ''}">
            <input type="checkbox" class="loc-chk item-chk" value="${item.code}">
            <div class="loc-info">
              <div class="loc-code">
                ${item.code}
                <span class="badge ${isRes ? 'badge-res' : 'badge-empty'}">${item.status}</span>
              </div>
              <div class="loc-meta">
                ${timeAgo(item.timestamp)} · ${item.worker} ${item.memo ? `· <strong>${item.memo}</strong>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleAllChk(checked) {
      document.querySelectorAll('.item-chk').forEach(c => c.checked = checked);
    }

    function getCheckedCodes() {
      return [...document.querySelectorAll('.item-chk:checked')].map(c => c.value);
    }

    function copySelected() {
      let codes = getCheckedCodes();
      if (codes.length === 0) {
        const filtered = filterG === 'ALL' ? allData : allData.filter(d => d.gLine === filterG);
        codes = filtered.filter(d => d.status === '빈자리').map(d => d.code);
      }
      if (codes.length === 0) { showToast('복사할 로케이션이 없습니다.'); return; }

      const text = codes.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(`${codes.length}건 복사 완료! 엑셀에 붙여넣으세요.`))
          .catch(() => fallbackCopy(text, codes.length));
      } else {
        fallbackCopy(text, codes.length);
      }
    }

    function fallbackCopy(text, count) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(`${count}건 복사 완료! 엑셀에 붙여넣으세요.`);
    }

    async function batchUpdate(newStatus) {
      const codes = getCheckedCodes();
      if (codes.length === 0) { showToast('먼저 항목을 체크해 주세요.'); return; }
      try {
        const res = await apiPost({ action: 'updateStatus', codes: codes, newStatus: newStatus });
        showToast(`${res.count || 0}건 → [${newStatus}] 변경 완료`);
        document.getElementById('chkAll').checked = false;
        loadList();
      } catch (err) {
        showToast('상태 변경 실패');
      }
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const diffMin = Math.floor((Date.now() - ts) / 60000);
      if (diffMin < 1) return '방금 전';
      if (diffMin < 60) return `${diffMin}분 전`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}시간 전`;
      return `${Math.floor(diffHr / 24)}일 전`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
    }
  </script>
</body>
</html>
