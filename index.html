<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>빈 로케이션 파인더</title>
  <script>
    // Google Apps Script 웹 앱 URL
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyQUV5Pm4W6Ocp06swFBZbXxHMqYfncR-emzegPJBQMjuos5LHecKB2fs1ELNvNa9M/exec';
  </script>
  <!-- 아이폰 사파리 등 네이티브 스캐너 미지원 기기용 백업 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --bg: #f3f4f6;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0 0 40px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }

    .tabs {
      display: flex; position: sticky; top: 0; z-index: 20;
      background: var(--card); border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 14px 8px; border: none; background: none;
      font-size: 15px; font-weight: 700; color: #6b7280; cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* 백그라운드 동기화 상태 바 */
    .sync-bar {
      display: none; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 14px; font-size: 12px; font-weight: 700;
      position: sticky; top: 49px; z-index: 19;
    }
    .sync-bar.syncing { display: flex; background: #eff6ff; color: #1d4ed8; border-bottom: 1px solid #bfdbfe; }
    .sync-bar.done { display: flex; background: #f0fdf4; color: #15803d; border-bottom: 1px solid #bbf7d0; }
    .sync-bar.error { display: flex; background: #fef2f2; color: #b91c1c; border-bottom: 1px solid #fecaca; }
    .sync-retry-btn {
      padding: 4px 10px; border: none; border-radius: 6px;
      background: #dc2626; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }

    .container { max-width: 560px; margin: 0 auto; padding: 12px; }
    .section { display: none; }
    .section.active { display: block; }

    .error-banner {
      background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5;
      padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45;
      margin-bottom: 10px; display: none; word-break: break-word;
    }

    .card {
      background: var(--card); border-radius: 12px; padding: 12px;
      margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: #4b5563;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }

    /* 스캐너 뷰파인더 */
    .scanner-wrap {
      position: relative; width: 100%; height: 280px;
      background: #0f172a; border-radius: 12px; overflow: hidden;
      margin-bottom: 10px;
    }
    #nativeVideo {
      width: 100%; height: 100%; object-fit: cover; display: none;
    }
    #reader {
      width: 100%; height: 100%; display: none;
    }
    #reader video {
      width: 100% !important; height: 280px !important; object-fit: cover !important;
    }

    .aim-overlay {
      position: absolute; inset: 0; pointer-events: none; z-index: 12;
      display: none; flex-direction: column;
    }
    .aim-shade { flex: 1; background: rgba(15, 23, 42, 0.48); }
    .aim-window {
      height: 86px; position: relative;
      border-top: 2px solid rgba(56, 189, 248, 0.85);
      border-bottom: 2px solid rgba(56, 189, 248, 0.85);
      box-shadow: inset 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .laser-line {
      position: absolute; left: 5%; right: 5%; top: 50%; height: 2px;
      background: rgba(239, 68, 68, 0.95);
      box-shadow: 0 0 10px 2px rgba(239, 68, 68, 0.85);
      transform: translateY(-50%); pointer-events: none; z-index: 15;
      display: none;
    }
    .engine-badge {
      position: absolute; top: 8px; left: 8px; z-index: 17;
      background: rgba(15, 23, 42, 0.78); color: #38bdf8;
      padding: 4px 9px; border-radius: 12px; font-size: 11px; font-weight: 800;
      display: none; pointer-events: none;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .scan-hud {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.86); color: #f8fafc;
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
      white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis;
      z-index: 16; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .cam-controls { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 12px 8px; border: none; border-radius: 9px;
      font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary { background: var(--primary); }
    .btn-dark { background: #334155; }
    .btn-amber { background: var(--warn); }
    .btn-green { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-outline {
      background: #fff; color: var(--text); border: 1px solid var(--border);
    }
    .btn:disabled { opacity: 0.5; }

    .opt-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: #374151; gap: 8px; flex-wrap: wrap;
    }
    .opt-row label { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }

    .row-flex { display: flex; gap: 8px; align-items: center; }
    input[type="text"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px;
    }

    .recent-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; gap: 8px;
    }
    .recent-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .st-tag {
      font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    }
    .st-saving { background: #dbeafe; color: #1d4ed8; }
    .st-saved { background: #dcfce7; color: #166534; }
    .st-dup { background: #fef3c7; color: #92400e; }
    .st-err { background: #fee2e2; color: #b91c1c; }

    .btn-mini {
      padding: 5px 10px; border-radius: 6px; border: none;
      font-size: 12px; font-weight: 700; cursor: pointer;
      background: #fee2e2; color: var(--danger); white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.68);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 50; padding: 12px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%; max-width: 520px; background: #fff;
      border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: slideUp 0.14s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .modal-badge {
      display: inline-block; background: #dbeafe; color: #1d4ed8;
      font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 20px;
    }
    .edit-hint { font-size: 12px; color: #6b7280; font-weight: 600; }

    .modal-code-input {
      width: 100% !important;
      background: #0f172a; color: #38bdf8;
      border: 2px solid #38bdf8 !important; border-radius: 12px !important;
      padding: 13px 10px !important; text-align: center;
      font-size: 25px !important; font-weight: 900; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 10px;
    }
    .modal-code-input:focus { outline: none; border-color: #60a5fa !important; }

    .nudge-row {
      display: flex; gap: 6px; align-items: center; margin-bottom: 10px;
    }
    .nudge-label { font-size: 12px; font-weight: 700; color: #4b5563; white-space: nowrap; }
    .nudge-btn {
      flex: 1; padding: 8px 6px; border: 1px solid var(--border); border-radius: 8px;
      background: #f8fafc; font-size: 13px; font-weight: 800; color: #1e293b; cursor: pointer;
    }
    .nudge-btn:active { background: #e2e8f0; }

    .tier-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 12px;
    }
    .tier-btn {
      padding: 10px 0; border: 1px solid var(--border); border-radius: 8px;
      background: #f9fafb; font-size: 14px; font-weight: 800; cursor: pointer;
    }
    .tier-btn.selected {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }

    .chip-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .chip {
      padding: 6px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: #f9fafb; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .chip.active { background: #dbeafe; border-color: var(--primary); color: #1d4ed8; }

    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .toolbar .btn { padding: 10px 6px; font-size: 13px; min-width: 90px; }
    .filter-scroll {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px;
    }
    .filter-pill {
      white-space: nowrap; padding: 6px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .filter-pill.active { background: #1e293b; color: #fff; border-color: #1e293b; }

    .loc-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px; background: #fff; border-radius: 10px; margin-bottom: 8px;
      border-left: 5px solid var(--success); box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .loc-item.reserved { border-left-color: var(--warn); background: #fffbeb; }
    .loc-item.pending-item { border-left-color: var(--primary); background: #f8fafc; }
    .loc-chk { width: 20px; height: 20px; accent-color: var(--primary); }
    .loc-info { flex: 1; }
    .loc-code { font-size: 16px; font-weight: 800; }
    .loc-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 4px;
      font-size: 11px; font-weight: 700; margin-left: 6px;
    }
    .badge-empty { background: #dcfce7; color: #166534; }
    .badge-res { background: #fef3c7; color: #92400e; }
    .badge-sync { background: #dbeafe; color: #1d4ed8; }

    #toast {
      position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
      background: rgba(17,24,39,0.93); color: #fff; padding: 10px 18px;
      border-radius: 24px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabScanBtn" onclick="switchTab('scan')">📷 바코드 스캔</button>
    <button type="button" class="tab-btn" id="tabListBtn" onclick="switchTab('list')">📋 입고 현황 (<span id="totalBadge">0</span>)</button>
  </div>

  <!-- 백그라운드 전송 상태 표시 바 -->
  <div id="syncBar" class="sync-bar">
    <span id="syncText"></span>
    <button type="button" id="syncRetryBtn" class="sync-retry-btn" style="display:none;" onclick="retryFailedTasks()">재전송</button>
  </div>

  <div id="toast"></div>

  <!-- 탭 1: 고속 바코드 스캔 -->
  <div id="sec-scan" class="container section active">
    <div id="errorBox" class="error-banner"></div>

    <div class="scanner-wrap" onclick="triggerRefocus()">
      <video id="nativeVideo" autoplay playsinline muted></video>
      <div id="reader"></div>
      <div id="aimOverlay" class="aim-overlay">
        <div class="aim-shade"></div>
        <div class="aim-window"></div>
        <div class="aim-shade"></div>
      </div>
      <div id="laserLine" class="laser-line"></div>
      <div id="engineBadge" class="engine-badge">⚡ 고속 인식</div>
      <div id="scanHud" class="scan-hud">카메라 켜기를 눌러 스캔을 시작하세요</div>
    </div>

    <div class="cam-controls">
      <button type="button" id="btnCamToggle" class="btn btn-primary" onclick="toggleCamera()">📷 카메라 켜기</button>
      <button type="button" id="btnZoom" class="btn btn-dark" style="display:none; flex:0.45;" onclick="cycleZoom()">🔍 1.0x</button>
      <button type="button" id="btnTorch" class="btn btn-dark" style="display:none; flex:0.45;" onclick="toggleTorch()">🔦 라이트</button>
      <button type="button" id="btnSwitchCam" class="btn btn-dark" style="display:none; flex:0.45;" onclick="switchRearLens()">🔄 렌즈</button>
    </div>

    <div class="card">
      <div class="opt-row" style="margin-bottom:8px;">
        <label>
          <input type="checkbox" id="chkStrictFormat" checked>
          로케이션 형식만 인식 (박스 바코드 무시)
        </label>
      </div>
      <div class="row-flex">
        <input type="text" id="workerName" placeholder="작업자 이름 (자동저장)" onchange="saveWorker()">
      </div>
    </div>

    <div class="card">
      <div class="card-title">바코드 훼손 시 직접 입력</div>
      <div class="row-flex">
        <input type="text" id="manualCode" placeholder="예: 3F-G01-12-04" style="text-transform:uppercase;">
        <button type="button" class="btn btn-dark" style="flex:0.35; padding:10px;" onclick="openManualConfirm()">확인</button>
      </div>
    </div>

    <div class="card" id="recentCard" style="display:none;">
      <div class="card-title">방금 등록한 내역 (실수 시 바로 취소)</div>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- 탭 2: 입고 현황 및 엑셀 복사 -->
  <div id="sec-list" class="container section">
    <div class="toolbar">
      <button type="button" class="btn btn-primary" onclick="copySelected()">📋 선택 복사</button>
      <button type="button" class="btn btn-amber" onclick="batchUpdate('선점중')">🏷️ 선점</button>
      <button type="button" class="btn btn-green" onclick="batchUpdate('입고완료')">✅ 입고완료</button>
      <button type="button" class="btn btn-dark" style="flex:0.35; min-width:52px;" onclick="loadList()">🔄</button>
    </div>

    <div class="filter-scroll" id="gFilterBar"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:0 4px;">
      <label style="font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;">
        <input type="checkbox" id="chkAll" class="loc-chk" onchange="toggleAllChk(this.checked)"> 전체 선택
      </label>
      <span id="listCountText" style="font-size:13px; color:#4b5563;">총 0건</span>
    </div>

    <div id="locListContainer">불러오는 중...</div>
  </div>

  <!-- 스캔 즉시 확인 및 수정 모달 -->
  <div id="confirmModal" class="modal-backdrop">
    <div class="modal-sheet">
      <div class="modal-header">
        <span class="modal-badge">스캔 인식 완료</span>
        <span class="edit-hint">✏️ 코드 터치 시 직접 수정</span>
      </div>

      <input type="text" id="modalCodeInput" class="modal-code-input"
             oninput="syncQuickButtonsFromInput()"
             autocomplete="off" autocapitalize="characters" spellcheck="false">

      <div id="quickFixWrap">
        <div class="nudge-row">
          <span class="nudge-label">번호 보정</span>
          <button type="button" class="nudge-btn" onclick="nudgeBay(-1)">◀ -1</button>
          <button type="button" class="nudge-btn" onclick="nudgeBay(1)">+1 ▶</button>
        </div>
        <div class="card-title" style="margin-bottom:6px;">
          <span>단 보정 (01~07단)</span>
          <span style="color:#6b7280; font-weight:500;">터치 시 즉시 반영</span>
        </div>
        <div class="tier-grid" id="modalTierGrid"></div>
      </div>

      <div class="chip-wrap" id="memoChips">
        <span class="chip" onclick="toggleMemo(this, '파렛트 1단')">파렛트 1단</span>
        <span class="chip" onclick="toggleMemo(this, '파렛트 2단')">파렛트 2단</span>
        <span class="chip" onclick="toggleMemo(this, '소형/박스')">소형/박스</span>
        <span class="chip" onclick="toggleMemo(this, '높이낮음')">높이낮음</span>
      </div>
      <input type="text" id="modalMemo" placeholder="추가 메모 (선택)" style="margin-bottom:14px;">

      <div class="row-flex">
        <button type="button" class="btn btn-outline" style="flex:0.45;" onclick="closeModal()">취소 / 재스캔</button>
        <button type="button" id="btnConfirmSubmit" class="btn btn-primary" onclick="submitConfirmedCode()">⚡ 즉시 등록</button>
      </div>
    </div>
  </div>

  <script>
    const LOCATION_REGEX = /^[0-9A-Z]+(-[0-9A-Z]+){2,3}$/i;
    const MAX_TIERS = 7;
    const QUEUE_STORAGE_KEY = 'wms_bg_sync_queue_v1';

    let activeEngine = null; // 'native' | 'html5'
    let nativeStream = null;
    let nativeTrack = null;
    let nativeDetector = null;
    let nativeLoopTimer = null;
    let isDetecting = false;

    let html5QrCode = null;
    let isScanning = false;
    let isModalOpen = false;
    let isTorchOn = false;
    let zoomSteps = [1.0, 1.5, 2.0, 3.0];
    let currentZoomIdx = 0;
    let rearCameras = [];
    let currentCamIdx = 0;
    let audioCtx = null;

    // 백그라운드 저장 대기열 및 로컬 상태
    let syncQueue = [];
    let isQueueProcessing = false;
    let syncDoneHideTimer = null;

    let recentItems = []; // { id, code, state: 'saving'|'saved'|'dup'|'err', msg }
    let serverData = [];  // 서버에서 받아온 원본 목록
    let allData = [];     // 화면에 표시할 병합 목록
    let filterG = 'ALL';

    function showError(msg) {
      const box = document.getElementById('errorBox');
      if (!box) return;
      box.innerHTML = '⚠️ ' + msg;
      box.style.display = 'block';
    }

    function clearError() {
      const box = document.getElementById('errorBox');
      if (box) box.style.display = 'none';
    }

    window.onerror = function(message, source, lineno) {
      showError('화면 오류(' + lineno + '줄): ' + message);
    };

    window.addEventListener('DOMContentLoaded', function() {
      const savedWorker = localStorage.getItem('wms_worker_name');
      if (savedWorker) document.getElementById('workerName').value = savedWorker;
      initTierButtons();
      restoreQueueFromStorage();
      loadList();
      if (syncQueue.length > 0) {
        processSyncQueue();
      }
    });

    function initTierButtons() {
      const grid = document.getElementById('modalTierGrid');
      let html = '';
      for (let i = 1; i <= MAX_TIERS; i++) {
        const t = String(i).padStart(2, '0');
        html += `<button type="button" class="tier-btn" data-tier="${t}" onclick="changeTier('${t}')">${t}</button>`;
      }
      grid.innerHTML = html;
    }

    function saveWorker() {
      localStorage.setItem('wms_worker_name', document.getElementById('workerName').value.trim());
    }

    function initAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playBeep(freq, duration) {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq || 1350;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (duration || 0.08));
      } catch (e) {}
    }

    // ================= 백그라운드 대기열 (0초 체감 저장 핵심) =================
    function persistQueue() {
      try {
        localStorage.setItem(QUEUE_STORAGE_KEY, JSON.stringify(syncQueue));
      } catch (e) {}
    }

    function restoreQueueFromStorage() {
      try {
        const raw = localStorage.getItem(QUEUE_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            syncQueue = parsed.map(t => (t.status === 'sending' ? Object.assign({}, t, { status: 'pending' }) : t));
          }
        }
      } catch (e) {
        syncQueue = [];
      }
      updateSyncBar();
    }

    function updateSyncBar(showDoneBriefly) {
      const bar = document.getElementById('syncBar');
      const txt = document.getElementById('syncText');
      const retryBtn = document.getElementById('syncRetryBtn');

      if (syncDoneHideTimer) {
        clearTimeout(syncDoneHideTimer);
        syncDoneHideTimer = null;
      }

      const pending = syncQueue.filter(t => t.status === 'pending' || t.status === 'sending');
      const failed = syncQueue.filter(t => t.status === 'failed');

      if (failed.length > 0 && pending.length === 0) {
        bar.className = 'sync-bar error';
        txt.textContent = `⚠️ 네트워크 오류로 저장 실패 (${failed.length}건)`;
        retryBtn.style.display = 'inline-block';
      } else if (pending.length > 0) {
        bar.className = 'sync-bar syncing';
        txt.textContent = `⏳ 구글 시트에 백그라운드 저장 중... (남은 ${pending.length}건)`;
        retryBtn.style.display = 'none';
      } else if (showDoneBriefly) {
        bar.className = 'sync-bar done';
        txt.textContent = '✅ 구글 시트 저장 완료';
        retryBtn.style.display = 'none';
        syncDoneHideTimer = setTimeout(() => {
          bar.className = 'sync-bar';
        }, 2000);
      } else {
        bar.className = 'sync-bar';
        retryBtn.style.display = 'none';
      }
    }

    function enqueueTask(task) {
      syncQueue.push(task);
      persistQueue();
      rebuildMergedData();
      updateSyncBar();
      processSyncQueue();
    }

    async function processSyncQueue() {
      if (isQueueProcessing) return;
      isQueueProcessing = true;

      let processedAny = false;

      try {
        while (true) {
          const task = syncQueue.find(t => t.status === 'pending');
          if (!task) break;

          task.status = 'sending';
          persistQueue();
          updateSyncBar();

          try {
            const res = await apiPost(task.payload);
            processedAny = true;

            // 대기열에서 제거
            syncQueue = syncQueue.filter(t => t.id !== task.id);
            persistQueue();

            if (task.payload.action === 'add') {
              if (res && res.success) {
                updateRecentState(task.id, 'saved', '저장됨');
              } else {
                const msg = (res && res.message) ? res.message : '이미 등록됨';
                updateRecentState(task.id, 'dup', msg);
                showToast(`${task.payload.code}: ${msg}`);
              }
            }
          } catch (err) {
            task.status = 'failed';
            persistQueue();
            if (task.payload.action === 'add') {
              updateRecentState(task.id, 'err', '전송 실패');
            }
            break; // 네트워크가 끊겼을 가능성이 높으므로 잠시 중단 후 재전송 버튼 표시
          }
        }
      } finally {
        isQueueProcessing = false;
        const hasPending = syncQueue.some(t => t.status === 'pending' || t.status === 'sending');
        const hasFailed = syncQueue.some(t => t.status === 'failed');

        if (!hasPending && !hasFailed && processedAny) {
          updateSyncBar(true);
          loadList(); // 대기열이 모두 비었을 때 서버 목록 1회만 최신화
        } else {
          updateSyncBar(false);
          rebuildMergedData();
        }
      }
    }

    function retryFailedTasks() {
      syncQueue.forEach(t => {
        if (t.status === 'failed') {
          t.status = 'pending';
          if (t.payload.action === 'add') {
            updateRecentState(t.id, 'saving', '재전송 중');
          }
        }
      });
      persistQueue();
      updateSyncBar();
      processSyncQueue();
    }

    function updateRecentState(taskId, state, msg) {
      const item = recentItems.find(r => r.id === taskId);
      if (item) {
        item.state = state;
        item.msg = msg || '';
        renderRecent();
      }
    }

    // 서버 데이터 + 아직 저장 중인 로컬 대기열을 합쳐 화면에 즉시 반영
    function rebuildMergedData() {
      const map = new Map();
      serverData.forEach(item => {
        map.set(item.code.toUpperCase(), Object.assign({}, item));
      });

      syncQueue.forEach(task => {
        const p = task.payload;
        if (p.action === 'add') {
          const code = String(p.code || '').toUpperCase();
          if (!map.has(code)) {
            const parts = code.split('-');
            map.set(code, {
              code: code,
              floor: parts[0] || '',
              gLine: parts[1] || '',
              bay: parts[2] || '',
              level: parts[3] || '',
              status: '빈자리',
              worker: p.worker || '현장작업자',
              memo: p.memo || '',
              timestamp: task.createdAt || Date.now(),
              isPending: true
            });
          }
        } else if (p.action === 'updateStatus') {
          const codes = p.codes || [];
          codes.forEach(c => {
            const key = String(c).toUpperCase();
            if (p.newStatus === '빈자리' || p.newStatus === '선점중') {
              if (map.has(key)) {
                map.get(key).status = p.newStatus;
                map.get(key).isPending = true;
              }
            } else {
              map.delete(key);
            }
          });
        }
      });

      const merged = Array.from(map.values());
      merged.sort((a, b) => {
        if (a.floor !== b.floor) return String(a.floor).localeCompare(String(b.floor));
        const gA = parseInt(String(a.gLine).replace(/\D/g, ''), 10) || 0;
        const gB = parseInt(String(b.gLine).replace(/\D/g, ''), 10) || 0;
        if (gA !== gB) return gA - gB;
        const bayA = parseInt(a.bay, 10) || 0;
        const bayB = parseInt(b.bay, 10) || 0;
        if (bayA !== bayB) return bayA - bayB;
        return (parseInt(a.level, 10) || 0) - (parseInt(b.level, 10) || 0);
      });

      allData = merged;
      document.getElementById('totalBadge').textContent = allData.length;
      renderFilters();
      renderList();
    }

    // ================= 스캐너 엔진 =================
    async function supportsNative1D() {
      if (!('BarcodeDetector' in window)) return false;
      try {
        const supported = await window.BarcodeDetector.getSupportedFormats();
        return supported.includes('code_128') || supported.includes('code_39');
      } catch (e) {
        return false;
      }
    }

    function ensureScannerLibrary() {
      return new Promise((resolve, reject) => {
        if (typeof Html5Qrcode !== 'undefined') {
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        script.onload = () => {
          if (typeof Html5Qrcode !== 'undefined') resolve();
          else reject(new Error('스캐너 라이브러리 초기화 실패'));
        };
        script.onerror = () => reject(new Error('네트워크 또는 와이파이가 스캐너 라이브러리 다운로드를 차단했습니다. 모바일 데이터(5G/LTE)로 시도해 주세요.'));
        document.head.appendChild(script);
      });
    }

    async function toggleCamera() {
      clearError();
      initAudio();
      if (isScanning) {
        await stopCamera();
      } else {
        await startCamera();
      }
    }

    async function startCamera(preferredDeviceId) {
      const btn = document.getElementById('btnCamToggle');
      btn.disabled = true;
      btn.textContent = '카메라 여는 중...';
      updateHud('고화질 카메라 준비 중...');

      try {
        if (!window.isSecureContext) {
          throw new Error('보안 주소(https://)에서만 카메라가 켜집니다.');
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('크롬(Chrome) 또는 사파리(Safari) 브라우저로 열어주세요.');
        }

        const useNative = await supportsNative1D();
        if (useNative) {
          await startNativeScanner(preferredDeviceId);
        } else {
          await startFallbackScanner();
        }

        isScanning = true;
        document.getElementById('laserLine').style.display = 'block';
        updateHud('빨간 가로선에 바코드 1개를 맞추세요 (15~25cm 거리 권장)');
        btn.textContent = '⏹ 카메라 끄기';
        btn.className = 'btn btn-danger';
      } catch (err) {
        const msg = (err && err.message) ? err.message : String(err);
        showError('카메라 실행 실패: ' + msg);
        updateHud('카메라 시작 실패 (위 안내 확인)');
        btn.textContent = '📷 카메라 켜기';
        btn.className = 'btn btn-primary';
      } finally {
        btn.disabled = false;
      }
    }

    async function startNativeScanner(preferredDeviceId) {
      activeEngine = 'native';
      const video = document.getElementById('nativeVideo');
      document.getElementById('reader').style.display = 'none';
      video.style.display = 'block';
      document.getElementById('aimOverlay').style.display = 'flex';

      const badge = document.getElementById('engineBadge');
      badge.textContent = '⚡ 고속 HD 스캐너';
      badge.style.display = 'block';

      const baseVideo = preferredDeviceId
        ? { deviceId: { exact: preferredDeviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
        : { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } };

      try {
        nativeStream = await navigator.mediaDevices.getUserMedia({ video: baseVideo, audio: false });
      } catch (e) {
        const fallbackVideo = preferredDeviceId
          ? { deviceId: { exact: preferredDeviceId } }
          : { facingMode: 'environment' };
        nativeStream = await navigator.mediaDevices.getUserMedia({ video: fallbackVideo, audio: false });
      }

      video.srcObject = nativeStream;
      await video.play();
      nativeTrack = nativeStream.getVideoTracks()[0];

      await applyContinuousFocus(nativeTrack);
      await refreshRearCameraList(nativeTrack);
      await setupNativeControls(nativeTrack);

      const supported = await window.BarcodeDetector.getSupportedFormats();
      const target1D = ['code_128', 'code_39', 'code_93', 'codabar', 'itf'].filter(f => supported.includes(f));
      nativeDetector = new window.BarcodeDetector({
        formats: target1D.length > 0 ? target1D : supported
      });

      isDetecting = false;
      scheduleNativeScan();
    }

    async function applyContinuousFocus(track) {
      try {
        if (!track || !track.getCapabilities) return;
        const caps = track.getCapabilities();
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (e) {}
    }

    async function refreshRearCameraList(activeTrack) {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videos = devices.filter(d => d.kind === 'videoinput');
        const rears = videos.filter(d => !/front|user|전면/i.test(d.label));
        rearCameras = rears.length >= 2 ? rears : videos;

        const activeId = activeTrack && activeTrack.getSettings ? activeTrack.getSettings().deviceId : '';
        const foundIdx = rearCameras.findIndex(c => c.deviceId === activeId);
        if (foundIdx >= 0) currentCamIdx = foundIdx;

        document.getElementById('btnSwitchCam').style.display = rearCameras.length >= 2 ? 'block' : 'none';
      } catch (e) {}
    }

    async function setupNativeControls(track) {
      try {
        if (!track || !track.getCapabilities) return;
        const caps = track.getCapabilities();

        if (caps.torch) {
          document.getElementById('btnTorch').style.display = 'block';
        }
        if (caps.zoom && caps.zoom.max > caps.zoom.min) {
          const minZ = caps.zoom.min;
          const maxZ = caps.zoom.max;
          zoomSteps = [1.0, 1.5, 2.0, 3.0].filter(z => z >= minZ && z <= maxZ);
          if (zoomSteps.length === 0) zoomSteps = [minZ, maxZ];

          const idx15 = zoomSteps.indexOf(1.5);
          currentZoomIdx = idx15 >= 0 ? idx15 : 0;
          const initZoom = zoomSteps[currentZoomIdx];
          await track.applyConstraints({ advanced: [{ zoom: initZoom }] });
          const zBtn = document.getElementById('btnZoom');
          zBtn.textContent = `🔍 ${initZoom.toFixed(1)}x`;
          zBtn.style.display = 'block';
        }
      } catch (e) {}
    }

    function scheduleNativeScan() {
      if (nativeLoopTimer) clearTimeout(nativeLoopTimer);
      nativeLoopTimer = setTimeout(runNativeScanTick, 60);
    }

    async function runNativeScanTick() {
      if (!isScanning || activeEngine !== 'native') return;

      const video = document.getElementById('nativeVideo');
      if (!isModalOpen && !isDetecting && video.readyState >= 2 && video.videoWidth > 0) {
        isDetecting = true;
        try {
          const barcodes = await nativeDetector.detect(video);
          if (barcodes && barcodes.length > 0) {
            pickCenterBarcode(barcodes, video);
          }
        } catch (e) {}
        isDetecting = false;
      }

      if (isScanning && activeEngine === 'native') {
        scheduleNativeScan();
      }
    }

    function pickCenterBarcode(barcodes, video) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cw = video.clientWidth || 360;
      const ch = video.clientHeight || 280;

      const scale = Math.max(cw / vw, ch / vh);
      const visibleSrcH = ch / scale;
      const centerY = vh / 2;
      const maxDist = (86 / scale) * 0.55;
      const strict = document.getElementById('chkStrictFormat').checked;

      let bestCode = null;
      let bestDist = Infinity;
      let rejectedSample = '';

      for (let i = 0; i < barcodes.length; i++) {
        const b = barcodes[i];
        const raw = String(b.rawValue || '').trim().toUpperCase();
        if (!raw) continue;

        const box = b.boundingBox;
        let dist = 0;
        let touchesCenter = true;

        if (box) {
          const boxTop = box.y;
          const boxBottom = box.y + box.height;
          const boxCenterY = (boxTop + boxBottom) / 2;
          const pad = Math.max(12, visibleSrcH * 0.025);
          const containsLine = (boxTop - pad <= centerY && boxBottom + pad >= centerY);
          dist = Math.abs(boxCenterY - centerY);
          touchesCenter = containsLine || (dist <= maxDist);
        }

        if (!touchesCenter) continue;

        if (strict && !LOCATION_REGEX.test(raw)) {
          rejectedSample = raw;
          continue;
        }

        if (dist < bestDist) {
          bestDist = dist;
          bestCode = raw;
        }
      }

      if (bestCode) {
        handleValidScan(bestCode);
      } else if (rejectedSample) {
        updateHud(`형식 다름(무시됨): ${rejectedSample}`);
      }
    }

    async function startFallbackScanner() {
      activeEngine = 'html5';
      await ensureScannerLibrary();

      document.getElementById('nativeVideo').style.display = 'none';
      document.getElementById('aimOverlay').style.display = 'none';
      document.getElementById('reader').style.display = 'block';

      const badge = document.getElementById('engineBadge');
      badge.textContent = '📷 HD 스캐너';
      badge.style.display = 'block';

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('reader', {
          formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.ITF,
            Html5QrcodeSupportedFormats.CODABAR
          ],
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          verbose: false
        });
      }

      const config = {
        fps: 20,
        qrbox: function(vw, vh) {
          const w = Math.min(vw - 12, Math.max(60, Math.floor(vw * 0.90)));
          const h = Math.min(vh - 12, Math.max(92, Math.min(115, Math.floor(vh * 0.36))));
          return { width: w, height: h };
        },
        videoConstraints: {
          facingMode: 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      try {
        await html5QrCode.start({ facingMode: 'environment' }, config, onFallbackScanSuccess, () => {});
      } catch (firstErr) {
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) throw firstErr;
        const backCam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
        await html5QrCode.start(backCam.id, config, onFallbackScanSuccess, () => {});
      }

      setupFallbackControls();
    }

    function onFallbackScanSuccess(decodedText) {
      if (isModalOpen) return;
      const code = decodedText.trim().toUpperCase();
      const strict = document.getElementById('chkStrictFormat').checked;
      if (strict && !LOCATION_REGEX.test(code)) {
        updateHud(`형식 다름(무시됨): ${code}`);
        return;
      }
      handleValidScan(code);
    }

    function setupFallbackControls() {
      try {
        const caps = html5QrCode.getRunningTrackCameraCapabilities();
        if (caps.torchFeature && caps.torchFeature().isSupported()) {
          document.getElementById('btnTorch').style.display = 'block';
        }
        if (caps.zoomFeature && caps.zoomFeature().isSupported()) {
          const zf = caps.zoomFeature();
          zoomSteps = [1.0, 1.5, 2.0].filter(z => z >= zf.min() && z <= zf.max());
          if (zoomSteps.length === 0) zoomSteps = [zf.min(), zf.max()];
          currentZoomIdx = 0;
          document.getElementById('btnZoom').textContent = `🔍 ${zoomSteps[0].toFixed(1)}x`;
          document.getElementById('btnZoom').style.display = 'block';
        }
      } catch (e) {}
    }

    async function stopCamera() {
      isScanning = false;
      isTorchOn = false;

      if (nativeLoopTimer) {
        clearTimeout(nativeLoopTimer);
        nativeLoopTimer = null;
      }
      if (nativeStream) {
        nativeStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
        nativeStream = null;
        nativeTrack = null;
      }
      const video = document.getElementById('nativeVideo');
      video.srcObject = null;
      video.style.display = 'none';

      if (html5QrCode && activeEngine === 'html5') {
        try { await html5QrCode.stop(); } catch (e) {}
      }
      activeEngine = null;

      document.getElementById('reader').style.display = 'none';
      document.getElementById('aimOverlay').style.display = 'none';
      document.getElementById('laserLine').style.display = 'none';
      document.getElementById('engineBadge').style.display = 'none';
      document.getElementById('btnTorch').style.display = 'none';
      document.getElementById('btnZoom').style.display = 'none';
      document.getElementById('btnSwitchCam').style.display = 'none';

      const btn = document.getElementById('btnCamToggle');
      btn.textContent = '📷 카메라 켜기';
      btn.className = 'btn btn-primary';
      updateHud('카메라 켜기를 눌러 스캔을 시작하세요');
    }

    async function cycleZoom() {
      if (!isScanning || zoomSteps.length === 0) return;
      currentZoomIdx = (currentZoomIdx + 1) % zoomSteps.length;
      const target = zoomSteps[currentZoomIdx];
      try {
        if (activeEngine === 'native' && nativeTrack) {
          await nativeTrack.applyConstraints({ advanced: [{ zoom: target }] });
        } else if (activeEngine === 'html5' && html5QrCode) {
          const caps = html5QrCode.getRunningTrackCameraCapabilities();
          await caps.zoomFeature().apply(target);
        }
        document.getElementById('btnZoom').textContent = `🔍 ${target.toFixed(1)}x`;
      } catch (e) {
        showToast('이 기기에서는 줌 변경이 지원되지 않습니다.');
      }
    }

    async function toggleTorch() {
      if (!isScanning) return;
      isTorchOn = !isTorchOn;
      try {
        if (activeEngine === 'native' && nativeTrack) {
          await nativeTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        } else if (activeEngine === 'html5' && html5QrCode) {
          const caps = html5QrCode.getRunningTrackCameraCapabilities();
          await caps.torchFeature().apply(isTorchOn);
        }
        document.getElementById('btnTorch').className = isTorchOn ? 'btn btn-amber' : 'btn btn-dark';
      } catch (e) {
        isTorchOn = !isTorchOn;
        showToast('이 기기에서는 라이트 제어가 지원되지 않습니다.');
      }
    }

    async function switchRearLens() {
      if (rearCameras.length < 2) return;
      currentCamIdx = (currentCamIdx + 1) % rearCameras.length;
      const nextCam = rearCameras[currentCamIdx];
      await stopCamera();
      await startCamera(nextCam.deviceId);
      showToast(`렌즈 전환 (${currentCamIdx + 1}/${rearCameras.length})`);
    }

    async function triggerRefocus() {
      if (!isScanning || activeEngine !== 'native' || !nativeTrack) return;
      try {
        const caps = nativeTrack.getCapabilities ? nativeTrack.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.includes('single-shot')) {
          await nativeTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
          setTimeout(() => applyContinuousFocus(nativeTrack), 350);
          showToast('초점 재조정');
        } else {
          await applyContinuousFocus(nativeTrack);
        }
      } catch (e) {}
    }

    function updateHud(text) {
      document.getElementById('scanHud').textContent = text;
    }

    function handleValidScan(code) {
      if (isModalOpen) return;
      if (navigator.vibrate) navigator.vibrate(60);
      playBeep(1350, 0.08);
      updateHud('인식 완료! 확인 후 등록하세요');
      openConfirmModal(code);
    }

    // ================= 확인 및 수정 모달 =================
    function openManualConfirm() {
      const code = document.getElementById('manualCode').value.trim().toUpperCase();
      if (!code) { showToast('로케이션 코드를 입력해 주세요.'); return; }
      openConfirmModal(code);
    }

    function openConfirmModal(code) {
      isModalOpen = true;
      document.getElementById('modalCodeInput').value = code;
      document.getElementById('modalMemo').value = '';
      document.querySelectorAll('#memoChips .chip').forEach(c => c.classList.remove('active'));
      syncQuickButtonsFromInput();
      document.getElementById('confirmModal').classList.add('open');
    }

    function syncQuickButtonsFromInput() {
      const val = document.getElementById('modalCodeInput').value.trim().toUpperCase();
      const parts = val.split('-');
      const wrap = document.getElementById('quickFixWrap');

      if (parts.length === 4) {
        wrap.style.display = 'block';
        const curTier = parts[3].padStart(2, '0');
        document.querySelectorAll('#modalTierGrid .tier-btn').forEach(b => {
          b.classList.toggle('selected', b.dataset.tier === curTier);
        });
      } else {
        wrap.style.display = 'none';
      }
    }

    function changeTier(tier) {
      const input = document.getElementById('modalCodeInput');
      const parts = input.value.trim().toUpperCase().split('-');
      if (parts.length !== 4) return;
      parts[3] = tier;
      input.value = parts.join('-');
      syncQuickButtonsFromInput();
    }

    function nudgeBay(delta) {
      const input = document.getElementById('modalCodeInput');
      const parts = input.value.trim().toUpperCase().split('-');
      if (parts.length !== 4) return;
      const num = parseInt(parts[2], 10);
      if (isNaN(num)) return;
      const next = Math.max(1, Math.min(99, num + delta));
      parts[2] = String(next).padStart(2, '0');
      input.value = parts.join('-');
      syncQuickButtonsFromInput();
    }

    function closeModal() {
      document.getElementById('confirmModal').classList.remove('open');
      // 0.4초 쿨다운 후 바로 다음 바코드 스캔 가능
      setTimeout(() => {
        isModalOpen = false;
        if (isScanning) updateHud('빨간 가로선에 바코드 1개를 맞추세요 (15~25cm 거리 권장)');
      }, 400);
    }

    function toggleMemo(el, text) {
      const input = document.getElementById('modalMemo');
      const active = el.classList.toggle('active');
      if (active) {
        input.value = input.value ? `${input.value}, ${text}` : text;
      } else {
        input.value = input.value.split(',').map(s => s.trim()).filter(s => s !== text).join(', ');
      }
    }

    // ================= 0초 즉시 등록 (백그라운드 큐 전송) =================
    async function apiPost(payload) {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function submitConfirmedCode() {
      const finalCode = document.getElementById('modalCodeInput').value.trim().toUpperCase();
      if (!finalCode) { showToast('로케이션 코드를 입력해 주세요.'); return; }

      // 로컬 목록에서 즉시 중복 체크 (0.01초 컷)
      const existsLocal = allData.some(item => item.code.toUpperCase() === finalCode);
      if (existsLocal) {
        showToast(`이미 등록된 자리입니다 (${finalCode})`);
        closeModal();
        return;
      }

      const worker = document.getElementById('workerName').value.trim() || '현장작업자';
      const memo = document.getElementById('modalMemo').value.trim();
      saveWorker();

      const taskId = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

      // 1. 최근 등록 목록에 즉시 표시
      recentItems.unshift({ id: taskId, code: finalCode, state: 'saving', msg: '저장중' });
      if (recentItems.length > 6) recentItems.pop();
      renderRecent();

      // 2. 입력창 초기화 및 모달 0초 즉시 닫기!
      document.getElementById('manualCode').value = '';
      playBeep(1600, 0.06);
      showToast(`⚡ ${finalCode} 등록! 바로 다음 스캔 가능`);
      closeModal();

      // 3. 백그라운드 대기열에 넣어 구글 시트로 순차 전송
      enqueueTask({
        id: taskId,
        status: 'pending',
        createdAt: Date.now(),
        payload: {
          action: 'add',
          code: finalCode,
          worker: worker,
          memo: memo
        }
      });
    }

    function renderRecent() {
      const card = document.getElementById('recentCard');
      const list = document.getElementById('recentList');
      if (recentItems.length === 0) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      list.innerHTML = recentItems.map(item => {
        const safeCode = item.code.replace(/'/g, "\\'");
        const safeId = item.id.replace(/'/g, "\\'");
        let tagHtml = '';
        if (item.state === 'saving') tagHtml = '<span class="st-tag st-saving">저장중</span>';
        else if (item.state === 'saved') tagHtml = '<span class="st-tag st-saved">✓ 저장됨</span>';
        else if (item.state === 'dup') tagHtml = '<span class="st-tag st-dup">중복</span>';
        else if (item.state === 'err') tagHtml = '<span class="st-tag st-err">실패</span>';

        return `
          <div class="recent-item">
            <div class="recent-left">
              <strong>${item.code}</strong>
              ${tagHtml}
            </div>
            <button type="button" class="btn-mini" onclick="undoRecent('${safeId}', '${safeCode}')">등록 취소</button>
          </div>
        `;
      }).join('');
    }

    function undoRecent(taskId, code) {
      // 아직 서버로 안 나간 대기 중 항목이면 대기열에서 즉시 삭제
      const pendingIdx = syncQueue.findIndex(t => t.id === taskId && t.status === 'pending');
      if (pendingIdx >= 0) {
        syncQueue.splice(pendingIdx, 1);
        persistQueue();
        recentItems = recentItems.filter(r => r.id !== taskId);
        renderRecent();
        rebuildMergedData();
        updateSyncBar();
        showToast(`${code} 등록이 즉시 취소되었습니다.`);
        return;
      }

      // 이미 전송 중이거나 전송 완료된 항목은 백그라운드 취소 요청
      recentItems = recentItems.filter(r => r.id !== taskId);
      renderRecent();
      showToast(`${code} 취소 처리 중...`);
      enqueueTask({
        id: 'cancel_' + Date.now(),
        status: 'pending',
        createdAt: Date.now(),
        payload: { action: 'updateStatus', codes: [code], newStatus: '취소삭제' }
      });
    }

    // ================= 탭 2: 입고 현황 관리 =================
    function switchTab(tab) {
      document.getElementById('tabScanBtn').classList.toggle('active', tab === 'scan');
      document.getElementById('tabListBtn').classList.toggle('active', tab === 'list');
      document.getElementById('sec-scan').classList.toggle('active', tab === 'scan');
      document.getElementById('sec-list').classList.toggle('active', tab === 'list');
      if (tab === 'list') {
        stopCamera();
        loadList();
      }
    }

    async function loadList() {
      if (!GAS_API_URL) return;
      try {
        const res = await fetch(`${GAS_API_URL}?action=list&t=${Date.now()}`);
        const json = await res.json();
        serverData = (json.success && Array.isArray(json.data)) ? json.data : [];
        rebuildMergedData();
      } catch (err) {
        if (allData.length === 0) {
          document.getElementById('locListContainer').innerHTML =
            `<div class="card" style="text-align:center; color:#dc2626;">목록을 불러오지 못했습니다.</div>`;
        }
      }
    }

    function renderFilters() {
      const bar = document.getElementById('gFilterBar');
      const gSet = [...new Set(allData.map(d => d.gLine).filter(Boolean))];
      let html = `<button type="button" class="filter-pill ${filterG === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">전체 (${allData.length})</button>`;
      gSet.forEach(g => {
        const cnt = allData.filter(d => d.gLine === g).length;
        html += `<button type="button" class="filter-pill ${filterG === g ? 'active' : ''}" onclick="setFilter('${g}')">${g} (${cnt})</button>`;
      });
      bar.innerHTML = html;
    }

    function setFilter(g) {
      filterG = g;
      document.getElementById('chkAll').checked = false;
      renderFilters();
      renderList();
    }

    function renderList() {
      const container = document.getElementById('locListContainer');
      const filtered = filterG === 'ALL' ? allData : allData.filter(d => d.gLine === filterG);
      document.getElementById('listCountText').textContent = `총 ${filtered.length}건`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="card" style="text-align:center; padding:30px; color:#6b7280;">현재 등록된 빈 로케이션이 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isRes = item.status === '선점중';
        const pendingClass = item.isPending ? ' pending-item' : '';
        const pendingBadge = item.isPending ? '<span class="badge badge-sync">저장중</span>' : '';
        return `
          <div class="loc-item ${isRes ? 'reserved' : ''}${pendingClass}">
            <input type="checkbox" class="loc-chk item-chk" value="${item.code}">
            <div class="loc-info">
              <div class="loc-code">
                ${item.code}
                <span class="badge ${isRes ? 'badge-res' : 'badge-empty'}">${item.status}</span>
                ${pendingBadge}
              </div>
              <div class="loc-meta">
                ${timeAgo(item.timestamp)} · ${item.worker} ${item.memo ? `· <strong>${item.memo}</strong>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleAllChk(checked) {
      document.querySelectorAll('.item-chk').forEach(c => c.checked = checked);
    }

    function getCheckedCodes() {
      return [...document.querySelectorAll('.item-chk:checked')].map(c => c.value);
    }

    function copySelected() {
      let codes = getCheckedCodes();
      if (codes.length === 0) {
        const filtered = filterG === 'ALL' ? allData : allData.filter(d => d.gLine === filterG);
        codes = filtered.filter(d => d.status === '빈자리').map(d => d.code);
      }
      if (codes.length === 0) { showToast('복사할 로케이션이 없습니다.'); return; }

      const text = codes.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(`${codes.length}건 복사 완료! 엑셀에 붙여넣으세요.`))
          .catch(() => fallbackCopy(text, codes.length));
      } else {
        fallbackCopy(text, codes.length);
      }
    }

    function fallbackCopy(text, count) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(`${count}건 복사 완료! 엑셀에 붙여넣으세요.`);
    }

    function batchUpdate(newStatus) {
      const codes = getCheckedCodes();
      if (codes.length === 0) { showToast('먼저 항목을 체크해 주세요.'); return; }
      document.getElementById('chkAll').checked = false;
      showToast(`⚡ ${codes.length}건 → [${newStatus}] 즉시 반영됨`);
      enqueueTask({
        id: 'batch_' + Date.now(),
        status: 'pending',
        createdAt: Date.now(),
        payload: { action: 'updateStatus', codes: codes, newStatus: newStatus }
      });
    }

    function timeAgo(ts) {
      if (!ts) return '';
      const diffMin = Math.floor((Date.now() - ts) / 60000);
      if (diffMin < 1) return '방금 전';
      if (diffMin < 60) return `${diffMin}분 전`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}시간 전`;
      return `${Math.floor(diffHr / 24)}일 전`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
